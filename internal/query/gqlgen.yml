schema:
  - schema.graphql

exec:
  filename: generated.go
  package: query

model:
  filename: models_gen.go
  package: query

resolver:
  layout: follow-schema
  dir: .
  package: query
  filename_template: "{name}.resolvers.go"

models:
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  JSON:
    model: github.com/99designs/gqlgen/graphql.Map
  Event:
    fields:
      # Resolved lazily so a query that doesn't ask for links pays
      # nothing, and we can DataLoader-batch later.
      links:
        resolver: true
      # usage / stopReason are derived from the event's JSON payload
      # rather than columns on the storage struct — wire them as
      # resolvers so the gqlgen-generated Event model stays a thin
      # reflection of the storage layer.
      usage:
        resolver: true
      stopReason:
        resolver: true
  # Session.totalUsage is served from the model field, populated eagerly in
  # one batched query by the `sessions` resolver (issue #65). It used to be a
  # per-Session resolver, which N+1'd a full-session load per row on every
  # 5 s SessionList refetch.
